<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">DRDebug — Don’t Regenerate, Debug</title>
  <desc id="desc">Evidence-guided repair of near-miss accelerator kernels. In a constructed Masked Softmax CPU example with 4,096 valid zero scores, sequential FP16 accumulation stops at 2,048: output weights total 200 percent. Changing only the accumulator to FP32 yields a denominator of 4,096 and weights totaling 100 percent. Inputs and outputs remain FP16. Real kernels require independent NPU validation.</desc>
  <rect x="1" y="1" width="1198" height="578" rx="18" fill="#171c25" stroke="#3d485b"/>
  <g fill="#b5a1f0"><rect x="48" y="49" width="10" height="10"/><rect x="63" y="49" width="10" height="10" opacity=".72"/><rect x="48" y="64" width="10" height="10" opacity=".72"/><path d="m64 69 4 4 7-10" stroke="#b5a1f0" stroke-width="3" fill="none"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="91" y="67" fill="#b0bbcb" font-size="14" letter-spacing="1.6">ACCELERATOR KERNEL REPAIR</text>
    <text x="48" y="183" fill="#e9ebef" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="-2">DRDebug<tspan fill="#b5a1f0">.</tspan></text>
    <text x="51" y="239" fill="#b5a1f0" font-family="Georgia, 'Times New Roman', serif" font-size="34">Don’t Regenerate, Debug.</text>
    <text x="51" y="299" fill="#e9ebef" font-size="22">Repair near-miss accelerator kernels.</text>
    <text x="51" y="335" fill="#b0bbcb" font-size="22">Evidence guides the edit.</text>
    <text x="51" y="368" fill="#b0bbcb" font-size="22">Validation decides what stays.</text>
    <path d="M51 406H510" stroke="#3d485b"/>
    <rect x="51" y="428" width="99" height="32" rx="5" fill="#26364b"/>
    <text x="100.5" y="449" text-anchor="middle" fill="#a6c3e8" font-size="14">Indexing</text>
    <rect x="159" y="428" width="99" height="32" rx="5" fill="#3e392b"/>
    <text x="208.5" y="449" text-anchor="middle" fill="#dfcc96" font-size="14">Masking</text>
    <rect x="267" y="428" width="112" height="32" rx="5" fill="#352e49"/>
    <text x="323" y="449" text-anchor="middle" fill="#c8b3e4" font-size="14">Reduction</text>
    <rect x="388" y="428" width="122" height="32" rx="5" fill="#402e2b"/>
    <text x="449" y="449" text-anchor="middle" fill="#edb59f" font-size="14">Numerics</text>
    <text x="51" y="503" fill="#b0bbcb" font-size="13" letter-spacing="1.4">REPRODUCE · DIAGNOSE · PATCH · VERIFY</text>
    <text x="51" y="532" fill="#b0bbcb" font-size="15">Keep the kernel. Repair the cause.</text>
  </g>
  <rect x="559" y="44" width="594" height="507" rx="10" fill="#10151c"/>
  <rect x="551" y="36" width="594" height="507" rx="10" fill="#212936" stroke="#3d485b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="578" y="68" fill="#b0bbcb" font-size="13" letter-spacing="1.2">REPAIR NOTE / MASKED SOFTMAX</text>
    <path d="M578 86H1118" stroke="#3d485b"/>
    <text x="578" y="121" fill="#e9ebef" font-family="Georgia, 'Times New Roman', serif" font-size="27">Why can weights total 200%?</text>
    <text x="578" y="155" fill="#b0bbcb" font-size="18">4,096 valid positions · all scores are zero</text>
    <text x="578" y="188" fill="#e9ebef" font-family="'Courier New', monospace" font-size="22">score = 0 → exp(score) = 1</text>
    <rect x="578" y="207" width="540" height="37" rx="3" fill="#3c2e2c"/>
    <rect x="578" y="249" width="540" height="37" rx="3" fill="#293d33"/>
    <text x="592" y="232" fill="#edb19b" font-family="'Courier New', monospace" font-size="22">− d = sum(e, accumulator=FP16)</text>
    <text x="592" y="274" fill="#afd3b7" font-family="'Courier New', monospace" font-size="22">+ d = sum(e, accumulator=FP32)</text>
    <text x="578" y="319" fill="#b0bbcb" font-size="13" letter-spacing="1">OUTPUT WEIGHT TOTAL · EXPECTED 100%</text>
    <path d="M845 335V415" stroke="#3d485b"/>
    <text x="578" y="344" fill="#edb19b" font-size="13" letter-spacing="1">BEFORE</text>
    <text x="578" y="389" fill="#edb19b" font-family="Georgia, 'Times New Roman', serif" font-size="49">200%</text>
    <text x="578" y="415" fill="#b0bbcb" font-family="'Courier New', monospace" font-size="18">denominator: 2,048</text>
    <path d="M775 372h39m-8-6 8 6-8 6" fill="none" stroke="#b5a1f0" stroke-width="2.5"/>
    <text x="872" y="344" fill="#afd3b7" font-size="13" letter-spacing="1">AFTER</text>
    <text x="872" y="389" fill="#afd3b7" font-family="Georgia, 'Times New Roman', serif" font-size="49">100%</text>
    <text x="872" y="415" fill="#b0bbcb" font-family="'Courier New', monospace" font-size="18">denominator: 4,096</text>
    <path d="M578 435H1118" stroke="#3d485b"/>
    <text x="578" y="461" fill="#e9ebef" font-size="17">Sequential FP16 rounding: 2,048 + 1 → 2,048.</text>
    <text x="578" y="490" fill="#b0bbcb" font-size="15">FP16 input / output. Only the accumulator changes.</text>
    <text x="578" y="517" fill="#b0bbcb" font-size="14">Constructed CPU example · NPU validation required.</text>
  </g>
</svg>
