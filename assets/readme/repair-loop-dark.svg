<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="repair-loop-title repair-loop-desc">
  <title id="repair-loop-title">An evidence-driven kernel repair loop</title>
  <desc id="repair-loop-desc">A near-miss kernel moves through reproduction, diagnosis, patching and deterministic validation to an accepted repair. Failed validation returns to diagnosis. The large language model proposes a targeted patch; the deterministic engine collects evidence and validates the result.</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#91a1bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="accepted-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#b5a1f0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="retry-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#91a1bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="478" rx="22" fill="#171c25" stroke="#3d485b"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="54" fill="#e9ebef" font-size="28" font-weight="700">From a near-miss to a verified repair</text>
    <text x="40" y="87" fill="#a8b3c6" font-size="18">Evidence guides the patch. Validation decides acceptance.</text>
    <path d="M40 111H1160" stroke="#3d485b" stroke-width="1"/>

    <g fill="#91a1bd" font-size="18" letter-spacing="1.5">
      <text x="40" y="139">START</text>
      <text x="968" y="139">RETAIN</text>
    </g>

    <g stroke="#91a1bd" stroke-width="2" fill="none" marker-end="url(#flow-arrow)">
      <path d="M210 204H223"/>
      <path d="M394 204H407"/>
      <path d="M578 204H591"/>
      <path d="M762 204H775"/>
    </g>
    <path d="M946 204H959" fill="none" stroke="#b5a1f0" stroke-width="2.2" marker-end="url(#accepted-arrow)"/>

    <rect x="40" y="153" width="160" height="102" rx="13" fill="#212936" stroke="#526077" stroke-width="1.5"/>
    <text x="120" y="196" text-anchor="middle" fill="#e0e5ed" font-size="21" font-weight="700">Near-miss</text>
    <text x="120" y="225" text-anchor="middle" fill="#e0e5ed" font-size="21">kernel</text>

    <rect x="232" y="153" width="152" height="102" rx="13" fill="#212936" stroke="#526077" stroke-width="1.5"/>
    <text x="308" y="196" text-anchor="middle" fill="#e0e5ed" font-size="21" font-weight="700">Reproduce</text>
    <text x="308" y="226" text-anchor="middle" fill="#a8b3c6" font-size="18">Engine</text>

    <rect x="416" y="153" width="152" height="102" rx="13" fill="#212936" stroke="#526077" stroke-width="1.5"/>
    <text x="492" y="196" text-anchor="middle" fill="#e0e5ed" font-size="21" font-weight="700">Diagnose</text>
    <text x="492" y="226" text-anchor="middle" fill="#a8b3c6" font-size="18">Evidence</text>

    <rect x="600" y="153" width="152" height="102" rx="13" fill="#352e49" stroke="#8570b4" stroke-width="1.5"/>
    <text x="676" y="196" text-anchor="middle" fill="#d3c5f2" font-size="21" font-weight="700">Patch</text>
    <text x="676" y="226" text-anchor="middle" fill="#c1b1dd" font-size="18">LLM</text>

    <rect x="784" y="153" width="152" height="102" rx="13" fill="#212936" stroke="#8570b4" stroke-width="1.5"/>
    <text x="860" y="196" text-anchor="middle" fill="#d3c5f2" font-size="21" font-weight="700">Validate</text>
    <text x="860" y="226" text-anchor="middle" fill="#c1b1dd" font-size="18">Engine</text>

    <rect x="968" y="153" width="192" height="102" rx="13" fill="#b5a1f0"/>
    <text x="1064" y="196" text-anchor="middle" fill="#171c25" font-size="21" font-weight="700">Accepted</text>
    <text x="1064" y="225" text-anchor="middle" fill="#212936" font-size="21">repair</text>

    <path d="M860 265V310Q860 322 848 322H504Q492 322 492 310V265" fill="none" stroke="#91a1bd" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round" marker-end="url(#retry-arrow)"/>
    <text x="676" y="298" text-anchor="middle" fill="#a8b3c6" font-size="18">On failure: diagnose again</text>

    <rect x="40" y="365" width="536" height="78" rx="12" fill="#26303e" stroke="#3d485b"/>
    <path d="M59 386V422" stroke="#91a1bd" stroke-width="3" stroke-linecap="round"/>
    <text x="77" y="396" fill="#e0e5ed" font-size="20" font-weight="700">Deterministic engine</text>
    <text x="77" y="425" fill="#a8b3c6" font-size="18">Reproduce failures · Collect evidence · Validate</text>

    <rect x="596" y="365" width="564" height="78" rx="12" fill="#352e49" stroke="#584870"/>
    <path d="M615 386V422" stroke="#b5a1f0" stroke-width="3" stroke-linecap="round"/>
    <text x="633" y="396" fill="#d3c5f2" font-size="20" font-weight="700">Large language model</text>
    <text x="633" y="425" fill="#c1b1dd" font-size="18">Reason over evidence · Propose a targeted patch</text>
  </g>
</svg>
