<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">DRDebug — Don’t Regenerate, Debug</title>
  <desc id="desc">Evidence-guided repair of near-miss accelerator kernels. In a constructed Masked Softmax CPU example with 4,096 valid zero scores, sequential FP16 accumulation stops at 2,048: output weights total 200 percent. Changing only the accumulator to FP32 yields a denominator of 4,096 and weights totaling 100 percent. Inputs and outputs remain FP16. Real kernels require independent NPU validation.</desc>
  <rect x="1" y="1" width="1198" height="578" rx="18" fill="#f7f4ee" stroke="#ced4df"/>
  <g fill="#6a50a8"><rect x="48" y="49" width="10" height="10"/><rect x="63" y="49" width="10" height="10" opacity=".72"/><rect x="48" y="64" width="10" height="10" opacity=".72"/><path d="m64 69 4 4 7-10" stroke="#6a50a8" stroke-width="3" fill="none"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="91" y="67" fill="#59677c" font-size="14" letter-spacing="1.6">ACCELERATOR KERNEL REPAIR</text>
    <text x="48" y="183" fill="#232b38" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="-2">DRDebug<tspan fill="#6a50a8">.</tspan></text>
    <text x="51" y="239" fill="#6a50a8" font-family="Georgia, 'Times New Roman', serif" font-size="34">Don’t Regenerate, Debug.</text>
    <text x="51" y="299" fill="#232b38" font-size="22">Repair near-miss accelerator kernels.</text>
    <text x="51" y="335" fill="#59677c" font-size="22">Evidence guides the edit.</text>
    <text x="51" y="368" fill="#59677c" font-size="22">Validation decides what stays.</text>
    <path d="M51 406H510" stroke="#ced4df"/>
    <rect x="51" y="428" width="99" height="32" rx="5" fill="#e4eefb"/>
    <text x="100.5" y="449" text-anchor="middle" fill="#3e628a" font-size="14">Indexing</text>
    <rect x="159" y="428" width="99" height="32" rx="5" fill="#f7f0dd"/>
    <text x="208.5" y="449" text-anchor="middle" fill="#7b6532" font-size="14">Masking</text>
    <rect x="267" y="428" width="112" height="32" rx="5" fill="#f0eaf7"/>
    <text x="323" y="449" text-anchor="middle" fill="#695184" font-size="14">Reduction</text>
    <rect x="388" y="428" width="122" height="32" rx="5" fill="#f9e3dc"/>
    <text x="449" y="449" text-anchor="middle" fill="#8b513b" font-size="14">Numerics</text>
    <text x="51" y="503" fill="#59677c" font-size="13" letter-spacing="1.4">REPRODUCE · DIAGNOSE · PATCH · VERIFY</text>
    <text x="51" y="532" fill="#59677c" font-size="15">Keep the kernel. Repair the cause.</text>
  </g>
  <rect x="559" y="44" width="594" height="507" rx="10" fill="#e5e0d9"/>
  <rect x="551" y="36" width="594" height="507" rx="10" fill="#fffdfa" stroke="#ced4df"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="578" y="68" fill="#59677c" font-size="13" letter-spacing="1.2">REPAIR NOTE / MASKED SOFTMAX</text>
    <path d="M578 86H1118" stroke="#ced4df"/>
    <text x="578" y="121" fill="#232b38" font-family="Georgia, 'Times New Roman', serif" font-size="27">Why can weights total 200%?</text>
    <text x="578" y="155" fill="#59677c" font-size="18">4,096 valid positions · all scores are zero</text>
    <text x="578" y="188" fill="#232b38" font-family="'Courier New', monospace" font-size="22">score = 0 → exp(score) = 1</text>
    <rect x="578" y="207" width="540" height="37" rx="3" fill="#f6e8e1"/>
    <rect x="578" y="249" width="540" height="37" rx="3" fill="#e9f0e7"/>
    <text x="592" y="232" fill="#9b503d" font-family="'Courier New', monospace" font-size="22">− d = sum(e, accumulator=FP16)</text>
    <text x="592" y="274" fill="#416c51" font-family="'Courier New', monospace" font-size="22">+ d = sum(e, accumulator=FP32)</text>
    <text x="578" y="319" fill="#59677c" font-size="13" letter-spacing="1">OUTPUT WEIGHT TOTAL · EXPECTED 100%</text>
    <path d="M845 335V415" stroke="#ced4df"/>
    <text x="578" y="344" fill="#9b503d" font-size="13" letter-spacing="1">BEFORE</text>
    <text x="578" y="389" fill="#9b503d" font-family="Georgia, 'Times New Roman', serif" font-size="49">200%</text>
    <text x="578" y="415" fill="#59677c" font-family="'Courier New', monospace" font-size="18">denominator: 2,048</text>
    <path d="M775 372h39m-8-6 8 6-8 6" fill="none" stroke="#6a50a8" stroke-width="2.5"/>
    <text x="872" y="344" fill="#416c51" font-size="13" letter-spacing="1">AFTER</text>
    <text x="872" y="389" fill="#416c51" font-family="Georgia, 'Times New Roman', serif" font-size="49">100%</text>
    <text x="872" y="415" fill="#59677c" font-family="'Courier New', monospace" font-size="18">denominator: 4,096</text>
    <path d="M578 435H1118" stroke="#ced4df"/>
    <text x="578" y="461" fill="#232b38" font-size="17">Sequential FP16 rounding: 2,048 + 1 → 2,048.</text>
    <text x="578" y="490" fill="#59677c" font-size="15">FP16 input / output. Only the accumulator changes.</text>
    <text x="578" y="517" fill="#59677c" font-size="14">Constructed CPU example · NPU validation required.</text>
  </g>
</svg>
