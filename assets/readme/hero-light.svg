<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DRDebug — Don’t Regenerate, Debug</title>
  <desc id="desc">A domain-specific agent for repairing near-miss accelerator kernels. A constructed FP16 sum illustrates an evidence-guided accumulator repair, with FP16 inputs and outputs.</desc>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="#f7f4ee" stroke="#ced4df"/>
  <g fill="#6a50a8"><rect x="48" y="43" width="10" height="10"/><rect x="63" y="43" width="10" height="10" opacity=".72"/><rect x="48" y="58" width="10" height="10" opacity=".72"/><path d="m64 63 4 4 7-10" stroke="#6a50a8" stroke-width="3" fill="none"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="91" y="61" fill="#66738a" font-size="15" letter-spacing="2">ACCELERATOR KERNEL REPAIR</text>
    <text x="48" y="164" fill="#232b38" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="-2">DRDebug<tspan fill="#6a50a8">.</tspan></text>
    <text x="51" y="220" fill="#6a50a8" font-family="Georgia, 'Times New Roman', serif" font-size="35">Don’t Regenerate, Debug.</text>
    <text x="51" y="276" fill="#66738a" font-size="22">Repair the kernel you already have.</text>
    <text x="51" y="309" fill="#66738a" font-size="22">Let evidence guide the next edit.</text>
    <path d="M51 345H539" stroke="#ced4df"/>
    <text x="51" y="376" fill="#66738a" font-size="13" letter-spacing="1.8">PRECISION · EVIDENCE · VALIDATION</text>
  </g>
  <rect x="624" y="47" width="534" height="332" rx="9" fill="#e7e2db"/>
  <rect x="616" y="39" width="534" height="332" rx="9" fill="#fffdfa" stroke="#ced4df"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="644" y="72" fill="#66738a" font-size="13" letter-spacing="1.2">REPAIR NOTE / 001</text>
    <rect x="968" y="55" width="154" height="24" rx="12" fill="#ebe5f4"/>
    <text x="1045" y="72" text-anchor="middle" fill="#6a50a8" font-size="12">Constructed example</text>
    <path d="M644 93H1122" stroke="#ced4df"/>
    <text x="644" y="126" fill="#232b38" font-size="23">When a sum loses its increment.</text>
    <text x="644" y="168" fill="#66738a" font-family="'Courier New', monospace" font-size="24">x = [2048, 1, −2048]</text>
    <text x="644" y="205" fill="#66738a" font-size="18">FP16 sum</text><text x="749" y="207" fill="#a36656" font-size="28">0</text>
    <path d="M796 198h56m-9-7 9 7-9 7" fill="none" stroke="#66738a" stroke-width="2"/>
    <text x="884" y="205" fill="#66738a" font-size="18">Reference</text><text x="997" y="207" fill="#54755e" font-size="28">1</text>
    <rect x="644" y="231" width="478" height="32" fill="#f3e6e1"/>
    <rect x="644" y="267" width="478" height="32" fill="#ebe5f4"/>
    <text x="659" y="254" fill="#a36656" font-family="'Courier New', monospace" font-size="20">− accumulator: FP16</text>
    <text x="659" y="290" fill="#6a50a8" font-family="'Courier New', monospace" font-size="20">+ accumulator: FP32</text>
    <text x="644" y="333" fill="#54755e" font-family="'Courier New', monospace" font-size="22">2048 → 2049 → 1</text>
    <text x="1122" y="333" text-anchor="end" fill="#66738a" font-size="12">FP16 input / output</text>
  </g>
</svg>
